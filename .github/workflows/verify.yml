name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Install pinned Compact launcher
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/midnightntwrk/compact/releases/download/compact-v0.5.2/compact-installer.sh \
            | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Select pinned Compact compiler
        shell: bash
        run: |
          compact update 0.31.1
          test "$(compact --version)" = "compact 0.5.2"
          test "$(compact compile --version)" = "0.31.1"

      - name: Install pinned JavaScript dependencies
        shell: bash
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile

      - name: Compile, test, build, and scan
        run: yarn verify

      - name: Audit runtime dependencies
        run: yarn audit --groups dependencies --level moderate
